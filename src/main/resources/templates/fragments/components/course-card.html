<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="courseCard(course)" class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 kotoba-card overflow-hidden">
            <div class="position-relative">
                <img th:if="${course.thumbnail != null and !course.thumbnail.isBlank()}"
                     th:src="${course.thumbnail}" class="card-img-top" th:alt="${course.title}"
                     style="height: 190px; object-fit: cover;">
                <div th:unless="${course.thumbnail != null and !course.thumbnail.isBlank()}"
                     class="d-flex align-items-center justify-content-center bg-light" style="height: 190px;">
                    <i class="bi bi-book fs-1 text-muted" aria-hidden="true"></i>
                </div>
                <span class="position-absolute top-0 start-0 m-3 badge px-3 py-1 rounded-pill" 
                      style="background-color: var(--navy-dark); color: white;"
                      th:text="${course.level != null ? course.level : 'N4'}">N4</span>
            </div>
            <div class="card-body d-flex flex-column p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="small text-muted">
                        <i class="bi bi-clock me-1"></i> <span th:text="${course.duration != null ? course.duration : '45 giờ học'}">45 giờ</span>
                    </span>
                    <span class="small text-muted">
                        <i class="bi bi-book me-1"></i> <span th:text="${course.lessonCount != null ? course.lessonCount + ' bài học' : '24 bài học'}">24 bài</span>
                    </span>
                </div>
                
                <h5 class="card-title fw-bold text-dark mb-2" th:text="${course.title}">Chinh phục Ngữ pháp & Đọc hiểu JLPT N4</h5>
                <p class="card-text text-muted small flex-grow-1" style="line-height: 1.6;" th:text="${course.description != null ? #strings.abbreviate(course.description, 95) : 'Hệ thống hóa toàn bộ kiến thức ngữ pháp trọng tâm, mẹo làm bài đọc hiểu chuẩn đề thi thật.'}">
                    Hệ thống hóa toàn bộ kiến thức ngữ pháp trọng tâm...
                </p>
                
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-light">
                    <div>
                        <span class="fw-bold fs-5" style="color: var(--steel-blue)" 
                              th:text="${course.price != null && course.price > 0 ? #numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Miễn phí'}">
                            399,000 đ
                        </span>
                    </div>
                    <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-steel-outline btn-sm">Course preview</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
