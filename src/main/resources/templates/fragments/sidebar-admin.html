<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar(activeMenu)" class="kotoba-sidebar">
        <!-- Brand Header -->
        <a th:href="@{/}" class="kotoba-brand">
            <div class="kotoba-logo-circle">
                <svg viewBox="0 0 100 100" width="44" height="44" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="50" fill="#E06D53" />
                    <circle cx="50" cy="42" r="22" fill="#FFFFFF" opacity="0.3" />
                    <path d="M 20 85 L 43 32 L 57 32 L 80 85 Z" fill="#173B57" />
                    <path d="M 43 32 L 57 32 L 62 48 L 56 44 L 50 50 L 44 44 L 38 48 Z" fill="#FFFFFF" />
                </svg>
            </div>
            <div class="kotoba-brand-text">
                <h4>JEPS</h4>
                <span>Quản trị &bull; Giáo vụ</span>
            </div>
        </a>

        <ul class="kotoba-nav">
            <li>
                <a class="nav-link" th:classappend="${activeMenu == 'admin-dashboard'} ? 'active' : ''" th:href="@{/admin/dashboard}">
                    <i class="bi bi-speedometer2"></i>
                    <span>Admin Dashboard</span>
                </a>
            </li>
            <li>
                <a class="nav-link" th:classappend="${activeMenu == 'users'} ? 'active' : ''" th:href="@{/admin/users}">
                    <i class="bi bi-people"></i>
                    <span>Quản lý người dùng</span>
                </a>
            </li>
            <li>
                <a class="nav-link" th:classappend="${activeMenu == 'logs'} ? 'active' : ''" th:href="@{/admin/logs}">
                    <i class="bi bi-terminal"></i>
                    <span>Nhật ký hệ thống</span>
                </a>
            </li>
            <li>
                <a class="nav-link" th:classappend="${activeMenu == 'profile'} ? 'active' : ''" th:href="@{/profile}">
                    <i class="bi bi-person-badge"></i>
                    <span>Hồ sơ cá nhân</span>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
