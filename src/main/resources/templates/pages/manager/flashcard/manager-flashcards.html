<div th:replace="~{layouts/manager-layout :: html(
    pageTitle='Quản lý Flashcard - Manager',
    activeMenu='manager-flashcards',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1" style="color:var(--navy-dark);font-size:1.65rem;">Quản lý Flashcard</h2>
                <p class="mb-0" style="color:var(--text-muted);font-size:0.9rem;">Quản lý bộ thẻ, thuật ngữ và định nghĩa của bài học</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="kotoba-card px-4 py-2 d-flex align-items-center gap-2" th:if="${flashcardListAvailable}">
                    <i class="bi bi-card-text" style="color:var(--steel-blue);"></i>
                    <span style="font-size:0.85rem;">Tổng: <strong th:text="${flashcardCount}">0</strong> flashcard</span>
                </div>
                <a class="btn btn-primary" th:href="@{/manager/flashcards/new}">
                    <i class="bi bi-plus-lg me-1"></i>Tạo bộ Flashcard
                </a>
            </div>
        </div>

        <div class="alert alert-danger" role="alert" th:if="${flashcardError}" th:text="${flashcardError}"></div>
        <div class="alert alert-success" role="alert" th:if="${flashcardSuccess}" th:text="${flashcardSuccess}"></div>
        <div class="alert alert-warning" role="alert" th:if="${lessonsError}" th:text="${lessonsError}"></div>

        <div class="kotoba-card p-0 overflow-hidden" th:if="${flashcardListAvailable}">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="ps-3">Thuật ngữ</th>
                        <th scope="col">Định nghĩa</th>
                        <th scope="col">Bài học</th>
                        <th scope="col">Cấp độ</th>
                        <th scope="col">Bộ thẻ</th>
                        <th scope="col" class="text-end pe-3">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(flashcards)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            Chưa có flashcard trong bảng flashcards.
                        </td>
                    </tr>
                    <tr th:each="card : ${flashcards}">
                        <td class="ps-3">
                            <div class="fw-semibold" th:text="${card.vocabulary}">日本語</div>
                            <small class="text-muted" th:if="${card.reading != null}" th:text="${card.reading}">にほんご</small>
                            <small class="d-block text-muted" th:if="${card.exampleSentence != null}" th:text="${card.exampleSentence}"></small>
                        </td>
                        <td th:text="${card.meaning}">tiếng Nhật</td>
                        <td th:text="${lessonTitles[card.lessonId] != null ? lessonTitles[card.lessonId] : 'Bài học #' + card.lessonId}">Bài học</td>
                        <td>
                            <div th:text="${card.jlptLevel != null ? card.jlptLevel : '—'}">N5</div>
                            <small class="text-muted" th:if="${card.reviewStatus != null}" th:text="${card.reviewStatus}"></small>
                        </td>
                        <td>
                            <span th:if="${card.custom}" class="badge text-bg-info">Tùy chỉnh</span>
                            <span th:if="${!card.custom}" class="badge text-bg-light">Chuẩn</span>
                            <small class="d-block text-muted" th:if="${card.customDeckName != null}" th:text="${card.customDeckName}"></small>
                        </td>
                        <td class="text-end pe-3">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/manager/flashcards/{id}/edit(id=${card.flashcardId})}"
                               th:aria-label="|Cập nhật flashcard ${card.vocabulary}|">
                                <i class="bi bi-pencil me-1"></i>Cập nhật
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal fade manager-flashcard-edit-modal" id="flashcardModal" tabindex="-1" aria-labelledby="flashcardModalTitle"
             aria-hidden="true" th:if="${flashcardForm != null}">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content border-0 rounded-4 shadow">
                    <form method="post" th:object="${flashcardForm}"
                          th:action="@{/manager/flashcards/{id}(id=${flashcardForm.flashcardId})}">
                        <div class="modal-header">
                            <h2 class="modal-title fs-5 fw-bold" id="flashcardModalTitle">Cập nhật Flashcard</h2>
                            <a class="btn-close" th:href="@{/manager/flashcards}" aria-label="Đóng"></a>
                        </div>
                        <div class="modal-body">
                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                                <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                            </div>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label" for="flashcardLesson">Bài học <span class="text-danger">*</span></label>
                                    <select class="form-select" id="flashcardLesson" th:field="*{lessonId}" required>
                                        <option value="">-- Chọn bài học --</option>
                                        <option th:each="lesson : ${lessons}" th:value="${lesson.id}" th:text="${lesson.title}">Bài học</option>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('lessonId')}" th:errors="*{lessonId}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardVocabulary">Từ vựng <span class="text-danger">*</span></label>
                                    <input class="form-control" id="flashcardVocabulary" th:field="*{vocabulary}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('vocabulary')}" th:errors="*{vocabulary}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardReading">Cách đọc</label>
                                    <input class="form-control" id="flashcardReading" th:field="*{reading}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardFront">Mặt trước</label>
                                    <textarea class="form-control" id="flashcardFront" th:field="*{frontContent}" rows="2"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardBack">Mặt sau</label>
                                    <textarea class="form-control" id="flashcardBack" th:field="*{backContent}" rows="2"></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="flashcardMeaning">Nghĩa <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="flashcardMeaning" th:field="*{meaning}" rows="2" required></textarea>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('meaning')}" th:errors="*{meaning}"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="flashcardExample">Câu ví dụ</label>
                                    <textarea class="form-control" id="flashcardExample" th:field="*{exampleSentence}" rows="2"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardLevel">Cấp độ JLPT</label>
                                    <select class="form-select" id="flashcardLevel" th:field="*{jlptLevel}">
                                        <option value="">-- Không chọn --</option>
                                        <option th:each="level : ${ {'N5','N4','N3','N2','N1'} }" th:value="${level}" th:text="${level}">N5</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardReviewStatus">Trạng thái ôn tập</label>
                                    <input class="form-control" id="flashcardReviewStatus" th:field="*{reviewStatus}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="flashcardDeck">Tên bộ thẻ</label>
                                    <input class="form-control" id="flashcardDeck" th:field="*{customDeckName}">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" id="flashcardCustom" th:field="*{custom}">
                                        <label class="form-check-label" for="flashcardCustom">Bộ thẻ tùy chỉnh</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <a class="btn btn-outline-secondary" th:href="@{/manager/flashcards}">Huỷ</a>
                            <button class="btn btn-primary" type="submit">Lưu cập nhật</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script th:if="${flashcardForm != null}">
            document.addEventListener('DOMContentLoaded', function () {
                const modalElement = document.getElementById('flashcardModal');
                if (modalElement && window.bootstrap) {
                    document.body.appendChild(modalElement);
                    bootstrap.Modal.getOrCreateInstance(modalElement).show();
                }
            });
        </script>
        <style>
            .manager-flashcard-edit-modal .modal-dialog {
                height: calc(100% - 1rem);
                max-height: calc(100dvh - 1rem);
                margin: 0.5rem auto;
            }

            .manager-flashcard-edit-modal .modal-content {
                max-height: 100%;
            }

            .manager-flashcard-edit-modal .modal-body {
                min-height: 0;
                overflow-y: auto;
                overscroll-behavior: contain;
            }

            @media (max-height: 600px) {
                .manager-flashcard-edit-modal .modal-dialog {
                    height: calc(100% - 0.5rem);
                    max-height: calc(100dvh - 0.5rem);
                    margin: 0.25rem auto;
                }
            }
        </style>
    </div>
</div>
