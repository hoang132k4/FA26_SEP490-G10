<div th:replace="~{layouts/manager-layout :: html(pageTitle='Quản lý Quiz - Manager', activeMenu='manager-quizzes', content=~{::#mainContent})}">
<div id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1" style="color:var(--navy-dark);">Quản lý Quiz</h2><p class="mb-0 text-muted">Dữ liệu được đọc trực tiếp từ bảng exercises</p></div><a class="btn btn-primary" th:href="@{/manager/quizzes/new}"><i class="bi bi-plus-lg me-1"></i>Tạo quiz</a></div>
    <div class="alert alert-danger" th:if="${quizError}" th:text="${quizError}"></div><div class="alert alert-success" th:if="${quizSuccess}" th:text="${quizSuccess}"></div>
    <div class="kotoba-card p-3 mb-3"><form class="row g-2" method="get" th:action="@{/manager/quizzes}"><div class="col-lg-5"><input class="form-control" name="search" th:value="${search}" placeholder="Tìm theo tên quiz..."></div><div class="col-md-4 col-lg-3"><select class="form-select" name="lessonId"><option value="">Tất cả bài học</option><option th:each="lesson : ${lessons}" th:value="${lesson.id}" th:text="${lesson.title}" th:selected="${lesson.id == lessonId}"></option></select></div><div class="col-md-4 col-lg-2"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == status}"></option></select></div><div class="col-md-4 col-lg-2 d-flex gap-2"><button class="btn btn-outline-primary flex-grow-1" type="submit">Lọc</button><a class="btn btn-outline-secondary" th:href="@{/manager/quizzes}">Xoá</a></div></form></div>
    <div class="kotoba-card overflow-hidden"><div class="px-4 py-3 border-bottom"><span class="text-muted">Tổng số: <strong th:text="${quizCount}">0</strong> quiz</span></div><div class="table-responsive"><table class="table table-hover mb-0 align-middle"><thead><tr><th class="ps-4">ID</th><th>Tên quiz</th><th>Bài học</th><th>Số câu</th><th>Đã gắn</th><th>Điểm đạt</th><th>Trạng thái</th><th class="pe-4">Thao tác</th></tr></thead><tbody><tr th:each="quiz : ${quizzes}"><td class="ps-4" th:text="${quiz.id}"></td><td class="fw-semibold" th:text="${quiz.title}"></td><td th:text="${quiz.lessonTitle ?: '-'}"></td><td th:text="${quiz.totalQuestions}"></td><td th:text="${quiz.linkedQuestionCount}"></td><td th:text="${quiz.passingScore + '%'}"></td><td th:text="${quiz.status}"></td><td class="pe-4"><a class="btn btn-sm btn-outline-primary" th:href="@{/manager/quizzes/{id}/edit(id=${quiz.id})}"><i class="bi bi-pencil"></i> Sửa</a></td></tr><tr th:if="${#lists.isEmpty(quizzes)}"><td colspan="8" class="text-center text-muted py-5">Không tìm thấy quiz.</td></tr></tbody></table></div></div>
</div>
</div>
