<div th:replace="~{layouts/manager-layout :: html(pageTitle=${isEdit ? 'Sửa Quiz - Manager' : 'Tạo Quiz - Manager'}, activeMenu='manager-quizzes', content=~{::#mainContent})}">
<div id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold" style="color:var(--navy-dark);" th:text="${isEdit ? 'Sửa cấu hình quiz' : 'Tạo quiz'}"></h2><p class="text-muted mb-0">Thông tin được lưu vào bảng exercises.</p></div><a class="btn btn-outline-secondary" th:href="@{/manager/quizzes}">Quay lại</a></div>
    <div class="alert alert-danger" th:if="${quizError}" th:text="${quizError}"></div>
    <form class="kotoba-card p-4" method="post" th:object="${quizForm}" th:action="${isEdit ? '/manager/quizzes/' + quizForm.id : '/manager/quizzes'}"><div class="row g-3"><div class="col-12"><label class="form-label">Tên quiz</label><input class="form-control" th:field="*{title}" required><div class="text-danger small" th:errors="*{title}"></div></div><div class="col-md-6"><label class="form-label">Bài học</label><select class="form-select" th:field="*{lessonId}" required><option value="">-- Chọn bài học --</option><option th:each="lesson : ${lessons}" th:value="${lesson.id}" th:text="${lesson.title}"></option></select><div class="text-danger small" th:errors="*{lessonId}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}" required><option value="">-- Chọn --</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}"></option></select><div class="text-danger small" th:errors="*{status}"></div></div><div class="col-md-6"><label class="form-label">Tổng số câu hỏi</label><input class="form-control" type="number" min="1" max="500" th:field="*{totalQuestions}" required><div class="text-danger small" th:errors="*{totalQuestions}"></div></div><div class="col-md-6"><label class="form-label">Điểm đạt (%)</label><input class="form-control" type="number" min="0" max="100" th:field="*{passingScore}" required><div class="text-danger small" th:errors="*{passingScore}"></div></div></div><div class="mt-4 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/manager/quizzes}">Huỷ</a><button class="btn btn-primary" type="submit">Lưu quiz</button></div></form>
</div>
</div>
