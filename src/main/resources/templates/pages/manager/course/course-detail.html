<div th:replace="~{layouts/manager-layout :: html(
    pageTitle='Chi tiết khóa học - Manager',
    activeMenu='manager-courses',
    content=~{::#mainContent}
)}">
<div id="mainContent">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="color:var(--navy-dark);font-size:1.65rem;">Chi tiết khóa học</h2>
            <p class="mb-0 text-muted">Toàn bộ dữ liệu khóa học đang lưu trong database (ID: <span th:text="${courseId}">1</span>)</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/manager/courses/{id}/edit(id=${courseId})}"><i class="bi bi-pencil me-1"></i>Sửa khóa học</a>
            <a class="btn btn-outline-secondary" th:href="@{/manager/courses}"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
        </div>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${courseError}" th:text="${courseError}"></div>
    <div class="alert alert-success" role="alert" th:if="${courseSuccess}" th:text="${courseSuccess}"></div>

    <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-4">
            <section class="kotoba-card p-4 h-100">
                <h3 class="h6 fw-bold mb-3" style="color:var(--navy-dark);">Ảnh thu nhỏ khóa học</h3>
                <img th:if="${thumbnailUrl != null}"
                     th:src="${thumbnailUrl}" alt="Ảnh thumbnail khóa học"
                     class="img-fluid rounded-3 w-100 mb-3" style="max-height:320px;object-fit:cover;">
                <div th:unless="${thumbnailUrl != null}"
                     class="rounded-3 bg-light d-flex align-items-center justify-content-center mb-3 text-muted"
                     style="height:220px;">
                    <div class="text-center"><i class="bi bi-image d-block mb-2" style="font-size:2rem;"></i>Chưa có ảnh thu nhỏ</div>
                </div>
                <div>
                    <div class="small fw-semibold text-muted mb-1">Đường dẫn ảnh</div>
                    <a th:if="${thumbnailUrl != null}"
                       th:href="${thumbnailUrl}" th:text="${thumbnailUrl}"
                       target="_blank" rel="noopener noreferrer" class="small text-break"></a>
                    <span th:unless="${thumbnailUrl != null}" class="text-muted">—</span>
                </div>
                <form class="mt-3" method="post" th:action="@{/manager/courses/{id}/status(id=${courseId})}">
                    <input type="hidden" name="status" th:value="${courseNextStatus}">
                    <button class="btn btn-sm rounded-pill"
                            th:classappend="${courseNextStatus == 'PUBLISHED' ? ' btn-success' : (courseNextStatus == 'ARCHIVED' ? ' btn-secondary' : ' btn-warning text-dark')}"
                            type="submit" th:text="${courseNextStatusLabel}">Published</button>
                </form>
            </section>
        </div>
        <div class="col-12 col-lg-8">
            <section class="kotoba-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <tbody>
                            <tr th:each="field : ${courseFields}">
                                <th class="ps-4 py-3 text-nowrap" style="width:30%;" th:text="${field.label}">Tên trường</th>
                                <td class="pe-4 py-3" style="white-space:pre-wrap;overflow-wrap:anywhere;">
                                    <span th:if="${field.rating}" class="d-inline-flex align-items-center gap-1" th:attr="aria-label=${'Đánh giá ' + field.displayValue}">
                                        <i th:each="star : ${#numbers.sequence(1, 5)}"
                                           class="bi" th:classappend="${star <= field.ratingValue ? ' bi-star-fill text-warning' : ' bi-star text-muted'}" aria-hidden="true"></i>
                                        <span class="ms-1" th:text="${field.displayValue}">0/5</span>
                                    </span>
                                    <span th:if="${field.status}" class="badge rounded-pill"
                                          th:classappend="${field.statusClass}" th:text="${field.displayValue}">Published</span>
                                    <span th:unless="${field.rating or field.status}" th:text="${field.displayValue}">Giá trị</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</div>
</div>
