<div th:replace="~{layouts/manager-layout :: html(pageTitle=${isEdit ? 'Sửa câu hỏi - Manager' : 'Thêm câu hỏi - Manager'}, activeMenu='manager-questions', content=~{::#mainContent})}">
<div id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold" style="color:var(--navy-dark);" th:text="${isEdit ? 'Sửa câu hỏi' : 'Thêm câu hỏi'}"></h2><p class="text-muted mb-0">Thông tin được lưu vào bảng questions.</p></div><a class="btn btn-outline-secondary" th:href="@{/manager/questions}">Quay lại</a></div>
    <div class="alert alert-danger" th:if="${questionError}" th:text="${questionError}"></div>
    <form class="kotoba-card p-4" method="post" th:object="${questionForm}" th:action="${isEdit ? '/manager/questions/' + questionForm.id : '/manager/questions'}"><div class="row g-3"><div class="col-12"><label class="form-label">Nội dung câu hỏi</label><textarea class="form-control" rows="5" th:field="*{content}" required></textarea><div class="text-danger small" th:errors="*{content}"></div></div><div class="col-md-4"><label class="form-label">Category</label><input class="form-control" list="categoryOptions" th:field="*{category}"><datalist id="categoryOptions"><option th:each="item : ${categories}" th:value="${item}"></option></datalist></div><div class="col-md-4"><label class="form-label">Đề thi liên kết</label><select class="form-select" th:field="*{examId}"><option value="">Không liên kết</option><option th:each="exam : ${exams}" th:value="${exam.examId}" th:text="${exam.examTitle}"></option></select></div><div class="col-md-4"><label class="form-label">Audio URL</label><input class="form-control" type="url" th:field="*{audioUrl}"></div><div class="col-md-6"><label class="form-label">Thứ tự</label><input class="form-control" type="number" min="1" th:field="*{orderIndex}" required><div class="text-danger small" th:errors="*{orderIndex}"></div></div><div class="col-md-6"><label class="form-label">Điểm</label><input class="form-control" type="number" min="0" th:field="*{points}" required><div class="text-danger small" th:errors="*{points}"></div></div><div class="col-12"><label class="form-label">Giải thích</label><textarea class="form-control" rows="5" th:field="*{explanation}"></textarea></div></div><div class="mt-4 d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/manager/questions}">Huỷ</a><button class="btn btn-primary" type="submit">Lưu câu hỏi</button></div></form>
</div>
</div>
