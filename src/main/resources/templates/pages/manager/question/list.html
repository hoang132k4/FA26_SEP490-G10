<div th:replace="~{layouts/manager-layout :: html(pageTitle='Question Bank - Manager', activeMenu='manager-questions', content=~{::#mainContent})}">
<div id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1" style="color:var(--navy-dark);">Question Bank</h2><p class="mb-0 text-muted">Danh sách câu hỏi được đọc trực tiếp từ database</p></div><a class="btn btn-primary" th:href="@{/manager/questions/new}"><i class="bi bi-plus-lg me-1"></i>Thêm câu hỏi</a></div>
    <div class="alert alert-danger" th:if="${questionError}" th:text="${questionError}"></div><div class="alert alert-success" th:if="${questionSuccess}" th:text="${questionSuccess}"></div>
    <div class="kotoba-card p-3 mb-3"><form class="row g-2" method="get" th:action="@{/manager/questions}"><div class="col-lg-5"><input class="form-control" name="search" th:value="${search}" placeholder="Tìm theo nội dung câu hỏi..."></div><div class="col-md-4 col-lg-3"><select class="form-select" name="category"><option value="">Tất cả category</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item}" th:selected="${item == category}"></option></select></div><div class="col-md-4 col-lg-3"><select class="form-select" name="examId"><option value="">Tất cả đề thi</option><option th:each="exam : ${exams}" th:value="${exam.examId}" th:text="${exam.examTitle}" th:selected="${exam.examId == examId}"></option></select></div><div class="col-md-4 col-lg-1"><button class="btn btn-outline-primary w-100" type="submit">Lọc</button></div></form></div>
    <div class="kotoba-card overflow-hidden"><div class="px-4 py-3 border-bottom"><span class="text-muted">Tổng số: <strong th:text="${questionCount}">0</strong> câu hỏi</span></div><div class="table-responsive"><table class="table table-hover mb-0 align-middle"><thead><tr><th class="ps-4">ID</th><th>Nội dung</th><th>Category</th><th>Đề thi</th><th>Thứ tự</th><th>Điểm</th><th class="pe-4">Thao tác</th></tr></thead><tbody><tr th:each="question : ${questions}"><td class="ps-4" th:text="${question.id}"></td><td style="min-width:300px;max-width:480px;" th:text="${question.content}"></td><td th:text="${question.category ?: '-'}"></td><td th:text="${question.examId ?: '-'}"></td><td th:text="${question.orderIndex}"></td><td th:text="${question.points}"></td><td class="pe-4"><a class="btn btn-sm btn-outline-primary" th:href="@{/manager/questions/{id}/edit(id=${question.id})}"><i class="bi bi-pencil"></i> Sửa</a></td></tr><tr th:if="${#lists.isEmpty(questions)}"><td colspan="7" class="text-center text-muted py-5">Không tìm thấy câu hỏi.</td></tr></tbody></table></div></div>
</div>
</div>
