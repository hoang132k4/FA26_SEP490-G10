<div th:replace="~{layouts/manager-layout :: html(
    pageTitle='Báo cáo nội dung - JEPS',
    activeMenu='manager-reports',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"><div><h2 class="fw-bold mb-1" style="color:var(--navy-dark)">Báo cáo nội dung</h2><p class="text-muted mb-0">Tổng quan về khóa học, bài học và tài nguyên trên hệ thống.</p></div><button class="btn btn-outline-primary" type="button" disabled title="Xuất báo cáo sẽ khả dụng khi dữ liệu thống kê được kết nối"><i class="bi bi-download me-1"></i> Xuất báo cáo</button></div>
        <div class="row g-3"><div class="col-md-4"><div class="kotoba-card p-4 h-100"><i class="bi bi-journal-bookmark fs-3" style="color:var(--steel-blue)"></i><div class="mt-3 text-muted">Khóa học</div><div class="fs-2 fw-bold">—</div><small class="text-muted">Dữ liệu được cập nhật từ danh mục khóa học.</small></div></div><div class="col-md-4"><div class="kotoba-card p-4 h-100"><i class="bi bi-book-half fs-3" style="color:var(--steel-blue)"></i><div class="mt-3 text-muted">Bài học</div><div class="fs-2 fw-bold">—</div><small class="text-muted">Thống kê bài học sẽ hiển thị khi được quản lý tập trung.</small></div></div><div class="col-md-4"><div class="kotoba-card p-4 h-100"><i class="bi bi-people fs-3" style="color:var(--steel-blue)"></i><div class="mt-3 text-muted">Lượt học</div><div class="fs-2 fw-bold">—</div><small class="text-muted">Số liệu tiến độ học sẽ hiển thị theo từng kỳ báo cáo.</small></div></div></div>
    </div>
</div>
