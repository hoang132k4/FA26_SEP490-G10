<div th:replace="~{layouts/manager-layout :: html(
    pageTitle='Báo cáo - Manager',
    activeMenu='manager-reports',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h3 class="fw-bold mb-1">Báo cáo</h3>
                <p class="text-muted mb-0">Xem và xuất báo cáo kết quả học tập, đăng ký khóa học.</p>
            </div>
        </div>

        <div th:if="${reportError}" class="alert alert-danger" role="alert" th:text="${reportError}"></div>

        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form method="get" th:action="@{/manager/reports}" class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="reportType" class="form-label fw-semibold">Loại báo cáo</label>
                        <select id="reportType" name="type" class="form-select">
                            <option th:each="reportType : ${reportTypes}"
                                    th:value="${reportType.value()}"
                                    th:text="${reportType.label()}"
                                    th:selected="${reportType.value() == selectedType}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="from" class="form-label fw-semibold">Từ ngày</label>
                        <input id="from" name="from" type="date" class="form-control" th:value="${from}">
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="to" class="form-label fw-semibold">Đến ngày</label>
                        <input id="to" name="to" type="date" class="form-control" th:value="${to}">
                    </div>
                    <div class="col-12 col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-search me-1"></i>Xem báo cáo
                        </button>
                    </div>
                </form>
                <form method="get" th:action="@{/manager/reports/export}" class="mt-3">
                    <input type="hidden" name="type" th:value="${selectedType}">
                    <input type="hidden" name="from" th:value="${from}">
                    <input type="hidden" name="to" th:value="${to}">
                    <button type="submit" class="btn btn-outline-success">
                        <i class="bi bi-download me-1"></i>Xuất báo cáo CSV
                    </button>
                </form>
            </div>
        </section>

        <section class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 pt-3 px-3 px-md-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <h5 class="fw-bold mb-0" th:text="${report.title()}">Báo cáo</h5>
                    <span class="badge rounded-pill text-bg-light"
                          th:text="${#lists.size(report.rows()) + ' bản ghi'}">0 bản ghi</span>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="text-nowrap px-3" th:each="header : ${report.headers()}" th:text="${header}">Cột</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${report.rows()}">
                                <td class="px-3 text-nowrap" th:each="value : ${row}" th:text="${value}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(report.rows())}">
                                <td class="text-center text-muted py-5"
                                    th:colspan="${#lists.size(report.headers())}">
                                    Không có dữ liệu báo cáo trong khoảng thời gian đã chọn.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>
