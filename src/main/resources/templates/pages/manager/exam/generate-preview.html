<div th:replace="~{layouts/manager-layout :: html(pageTitle='Xem trước đề thi - Manager', activeMenu='manager-exams', content=~{::#mainContent})}">
<div id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="color:var(--navy-dark);">Xem trước câu hỏi được chọn</h2>
            <p class="mb-0 text-muted">
                <span th:text="${exam.examTitle}"></span>
                <span class="badge bg-info ms-2" th:text="${exam.jlptLevel}"></span>
                <span class="badge bg-secondary ms-1" th:text="${exam.examType}"></span>
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/manager/exams/{id}/questions(id=${exam.examId})}">Quay lại</a>
    </div>

    <div class="alert alert-info mb-4">
        <i class="bi bi-info-circle me-1"></i>
        Hệ thống đã chọn <strong th:text="${preview.totalAdded()}">0</strong> câu hỏi từ ngân hàng.
        Xem lại từng phần bên dưới. Bấm <strong>Chọn lại</strong> nếu muốn đổi câu của một phần, hoặc <strong>Xác nhận</strong> để gắn vào đề.
    </div>

    <div class="alert alert-danger" th:if="${examError}" th:text="${examError}"></div>
    <div class="alert alert-success" th:if="${examSuccess}" th:text="${examSuccess}"></div>

    <!-- Tiến độ hiện tại + preview -->
    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="p : ${sectionProgress}">
            <div class="kotoba-card p-3 h-100">
                <span class="fw-semibold" th:text="${p.label}">Phần</span>
                <div class="fs-4 fw-bold mt-1">
                    <span th:text="${p.linked}">0</span>
                    <span class="text-success" th:if="${preview.sections().get(p.section) != null && !preview.sections().get(p.section).isEmpty()}"
                          th:text="' + ' + ${#lists.size(preview.sections().get(p.section))}"></span>
                    <span class="text-muted fs-6">/<span th:text="${p.required}">0</span> câu</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Danh sách câu hỏi preview theo phần -->
    <th:block th:each="entry : ${preview.sections()}">
        <div class="kotoba-card overflow-hidden mb-4" th:if="${!entry.value.isEmpty()}">
            <div class="px-4 py-3 border-bottom d-flex justify-content-between align-items-center">
                <span class="fw-bold" style="color:var(--navy-dark);">
                    <span th:text="${sectionLabels.get(entry.key)}">Phần</span>
                    <span class="text-muted fw-normal" th:text="'(' + ${#lists.size(entry.value)} + ' câu mới)'"></span>
                </span>
                <form method="post" th:action="@{/manager/exams/{id}/questions/generate/regenerate(id=${exam.examId})}">
                    <input type="hidden" name="section" th:value="${entry.key}">
                    <button class="btn btn-sm btn-outline-primary" type="submit">
                        <i class="bi bi-arrow-repeat me-1"></i>Chọn lại phần này
                    </button>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th class="ps-4" style="width:60px;">#</th>
                        <th>Nội dung</th>
                        <th>Loại</th>
                        <th>Kỹ năng</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="q, stat : ${entry.value}">
                        <td class="ps-4 text-muted" th:text="${stat.index + 1}">1</td>
                        <td style="min-width:250px;max-width:450px;">
                            <div class="text-truncate" style="max-width:450px;" th:text="${q.content()}"></div>
                            <small class="text-muted" th:text="${(q.jlptLevel() ?: '') + ' ' + (q.questionType() ?: '')}"></small>
                        </td>
                        <td><span class="badge bg-primary" th:text="${q.questionType()}"></span></td>
                        <td th:text="${q.skillType() ?: '-'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>

    <!-- Action buttons -->
    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
        <a class="btn btn-outline-secondary" th:href="@{/manager/exams/{id}/questions(id=${exam.examId})}">
            <i class="bi bi-x-lg me-1"></i>Huỷ bỏ
        </a>
        <form method="post" th:action="@{/manager/exams/{id}/questions/generate/confirm(id=${exam.examId})}">
            <button class="btn btn-primary btn-lg" type="submit">
                <i class="bi bi-check-lg me-1"></i>Xác nhận gắn <span th:text="${preview.totalAdded()}">0</span> câu vào đề
            </button>
        </form>
    </div>
</div>
</div>
