<div th:replace="~{layouts/auth-layout :: html(
    pageTitle='Quên mật khẩu - JEPS',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--navy-dark)">Quên mật khẩu</h4>
            <p class="small text-muted">Nhập email đã đăng ký để nhận liên kết khôi phục mật khẩu</p>
        </div>


        <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-main)" for="emailInput">
                    Email đã đăng ký
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email"
                           id="emailInput"
                           th:field="*{email}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           required
                           placeholder="name@example.com"
                           title="Registered Email">
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn btn-sakura w-100 py-2 fw-semibold">
                <i class="bi bi-send me-1"></i> Gửi liên kết khôi phục
            </button>

            <div class="text-center mt-4 small">
                <a th:href="@{/auth/login}" class="text-decoration-none fw-semibold" style="color: var(--sakura-accent)">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
                </a>
            </div>
        </form>
    </div>
</div>
