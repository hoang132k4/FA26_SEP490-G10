<div th:replace="~{layouts/learner-layout :: html(
    pageTitle='Đổi mật khẩu - JEPS',
    activeMenu='profile',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="card p-4 kotoba-card shadow-sm col-lg-7 col-md-9 mx-auto mt-3">
            <div class="mb-4 text-center">
                <h4 class="fw-bold mb-1" style="color: var(--navy-dark)">Đổi mật khẩu tài khoản</h4>
                <p class="small text-muted">Vui lòng nhập mật khẩu hiện tại và mật khẩu mới để cập nhật</p>
            </div>

            <form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post">
                <!-- CSRF Token handled automatically by Thymeleaf -->

                <!-- Current Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color: var(--text-main)" for="currentPassword">
                        Mật khẩu hiện tại <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                        <input type="password"
                               id="currentPassword"
                               th:field="*{currentPassword}"
                               class="form-control border-start-0"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                               required
                               placeholder="••••••••"
                               title="Current Password">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color: var(--text-main)" for="newPassword">
                        Mật khẩu mới <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"
                               class="form-control border-start-0"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                               required
                               minlength="8"
                               maxlength="64"
                               placeholder="Tối thiểu 8 ký tự"
                               title="New Password">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    <div class="form-text small text-muted">Từ 8-64 ký tự, gồm chữ hoa, chữ thường, số, ký tự đặc biệt và khác mật khẩu hiện tại.</div>
                </div>

                <!-- Confirm New Password -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold" style="color: var(--text-main)" for="confirmPassword">
                        Xác nhận mật khẩu mới <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               class="form-control border-start-0"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               required
                               minlength="8"
                               maxlength="64"
                               placeholder="Nhập lại mật khẩu mới"
                               title="Confirm Password">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/profile}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại hồ sơ
                    </a>
                    <button type="submit" class="btn btn-sakura px-4 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
