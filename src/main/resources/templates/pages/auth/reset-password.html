<div th:replace="~{layouts/auth-layout :: html(
    pageTitle='Đặt lại mật khẩu - JEPS',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--navy-dark)">Đặt lại mật khẩu mới</h4>
            <p class="small text-muted">Vui lòng thiết lập mật khẩu mới (8-64 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt)</p>
        </div>

        <form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}" method="post">
            <!-- Hidden token input -->
            <input type="hidden" th:field="*{token}" />

            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-main)" for="newPassword">
                    Mật khẩu mới
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password"
                           id="newPassword"
                           th:field="*{newPassword}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                           required
                           minlength="8"
                           maxlength="64"
                           placeholder="••••••••"
                           title="Password / Confirm Password">
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                <small class="form-text text-muted" style="font-size: 0.78rem;">
                    Từ 8-64 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-main)" for="confirmPassword">
                    Xác nhận mật khẩu mới
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           required
                           minlength="8"
                           maxlength="64"
                           placeholder="••••••••"
                           title="Password / Confirm Password">
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-sakura w-100 py-2 fw-semibold">
                <i class="bi bi-shield-check me-1"></i> Cập nhật mật khẩu
            </button>

            <div class="text-center mt-4 small">
                <a th:href="@{/auth/login}" class="text-decoration-none fw-semibold" style="color: var(--sakura-accent)">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
                </a>
            </div>
        </form>
    </div>
</div>
