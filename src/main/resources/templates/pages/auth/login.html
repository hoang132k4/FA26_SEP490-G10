<div th:replace="~{layouts/auth-layout :: html(
    pageTitle='Đăng nhập - JEPS',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--text-primary)">Đăng nhập tài khoản</h4>
            <p class="small text-muted">Chào mừng bạn quay lại học tập cùng JEPS</p>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)">Email hoặc Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" required placeholder="learner@jeps.edu.vn">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-semibold mb-0" style="color: var(--text-primary)">Mật khẩu</label>
                    <a th:href="@{/auth/forgot-password}" class="small text-decoration-none" style="color: var(--sakura-accent)">Quên mật khẩu?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" required placeholder="••••••••">
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>

            <button type="submit" class="btn btn-sakura w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>

            <!-- Divider -->
            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 my-0 text-muted opacity-25">
                <span class="px-2 small text-muted">Hoặc tiếp tục với</span>
                <hr class="flex-grow-1 my-0 text-muted opacity-25">
            </div>

            <!-- Google Sign-in Button -->
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 google-auth-btn shadow-sm" style="background: #ffffff; border: 1.5px solid #dadce0; border-radius: 8px; font-weight: 500; color: #3c4043; text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Tiếp tục với Google</span>
            </a>

            <div class="text-center mt-4 small text-muted">
                Chưa có tài khoản? 
                <a th:href="@{/auth/register}" class="fw-semibold text-decoration-none" style="color: var(--sakura-accent)">
                    Đăng ký miễn phí
                </a>
            </div>
        </form>
    </div>
</div>
