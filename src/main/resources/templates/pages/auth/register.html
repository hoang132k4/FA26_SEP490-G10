<div th:replace="~{layouts/auth-layout :: html(
    pageTitle='Đăng ký tài khoản - JEPS',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--text-primary)">Đăng ký tài khoản</h4>
            <p class="small text-muted">Bắt đầu hành trình chinh phục JLPT cùng JEPS</p>
        </div>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>
            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)" for="fullNameInput">
                    Họ và tên <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text"
                           id="fullNameInput"
                           th:field="*{fullName}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="Nguyễn Văn A"
                           maxlength="100"
                           title="Full Name"
                           required>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)" for="emailInput">
                    Email <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email"
                           id="emailInput"
                           th:field="*{email}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="learner@jeps.edu.vn"
                           title="Email"
                           required>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)" for="phoneInput">
                    Số điện thoại <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="tel"
                           id="phoneInput"
                           th:field="*{phone}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                           placeholder="0912345678"
                           maxlength="10"
                           title="Phone Number"
                           required>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)" for="passwordInput">
                    Mật khẩu <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password"
                           id="passwordInput"
                           th:field="*{password}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="••••••••"
                           minlength="8"
                           maxlength="64"
                           title="Password / Confirm Password"
                           required>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <small class="form-text text-muted" style="font-size: 0.78rem;">
                    Từ 8-64 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
                </small>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label class="form-label small fw-semibold" style="color: var(--text-primary)" for="confirmPasswordInput">
                    Xác nhận mật khẩu <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password"
                           id="confirmPasswordInput"
                           th:field="*{confirmPassword}"
                           class="form-control border-start-0"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           placeholder="••••••••"
                           minlength="8"
                           maxlength="64"
                           title="Password / Confirm Password"
                           required>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn btn-sakura w-100 py-2 fw-semibold">
                <i class="bi bi-person-plus me-1"></i> Đăng ký tài khoản
            </button>

            <!-- Divider -->
            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 my-0 text-muted opacity-25">
                <span class="px-2 small text-muted">Hoặc đăng ký nhanh bằng</span>
                <hr class="flex-grow-1 my-0 text-muted opacity-25">
            </div>

            <!-- Google Sign-up Button -->
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 google-auth-btn shadow-sm" style="background: #ffffff; border: 1.5px solid #dadce0; border-radius: 8px; font-weight: 500; color: #3c4043; text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Đăng ký với Google</span>
            </a>

            <!-- Login Navigation Link -->
            <div class="text-center mt-4 small text-muted">
                Đã có tài khoản? 
                <a th:href="@{/auth/login}" class="fw-semibold text-decoration-none" style="color: var(--sakura-accent)">
                    Đăng nhập ngay
                </a>
            </div>
        </form>
    </div>
</div>
