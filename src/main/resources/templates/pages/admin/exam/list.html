<div th:replace="~{layouts/admin-layout :: html(
    pageTitle='Quản lý đề thi - JEPS',
    activeMenu='exams',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1" style="color:var(--navy-dark)">Quản lý đề thi</h2>
                <p class="text-muted mb-0">Khu vực quản trị đề thi thử JLPT.</p>
            </div>
            <a class="btn btn-outline-primary" th:href="@{/manager/exams}"><i class="bi bi-file-earmark-text me-1"></i> Mở quản lý nội dung</a>
        </div>
        <div class="kotoba-card p-5 text-center">
            <i class="bi bi-clipboard2-check fs-1" style="color:var(--steel-blue)"></i>
            <h5 class="fw-bold mt-3">Chưa có đề thi nào</h5>
            <p class="text-muted mb-0">Danh sách đề thi sẽ hiển thị khi dữ liệu đề thi được tạo trong hệ thống.</p>
        </div>
    </div>
</div>
