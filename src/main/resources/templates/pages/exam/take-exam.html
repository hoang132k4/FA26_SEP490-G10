<div th:replace="~{layouts/learner-layout :: html(
    pageTitle=${exam.examTitle},
    activeMenu='exams',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <section class="card kotoba-card p-4 p-lg-5">
            <span class="text-uppercase fw-bold small text-muted">JLPT Mock Exam</span>
            <h1 class="h3 fw-bold mt-2" th:text="${exam.examTitle}">Exam title</h1>
            <div class="d-flex flex-wrap gap-3 text-muted mb-4">
                <span th:if="${exam.jlptLevel != null}" th:text="${exam.jlptLevel}">N5</span>
                <span th:if="${exam.durationMinutes != null}" th:text="${exam.durationMinutes + ' minutes'}">60 minutes</span>
                <span th:if="${exam.totalQuestions != null}" th:text="${exam.totalQuestions + ' questions'}">0 questions</span>
            </div>
            <div class="alert alert-warning mb-4" role="alert">
                Chưa có bảng câu hỏi trong schema Supabase được cung cấp nên chưa thể bắt đầu đề thi này.
                Hệ thống không hiển thị câu hỏi mẫu.
            </div>
            <a th:href="@{/mock-exam/{id}(id=${exam.examId})}" class="btn btn-steel-outline align-self-start">
                Quay lại chi tiết đề thi
            </a>
        </section>
    </div>
</div>
