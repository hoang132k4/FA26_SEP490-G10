<div th:replace="~{layouts/public-layout :: html(
    pageTitle='Danh sách Khóa học - Kotoba',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <!-- Filter Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom border-light">
            <div>
                <span class="text-uppercase fw-bold small text-muted">Chương trình đào tạo</span>
                <h2 class="fw-bold mb-0 text-dark">Các Khóa học Luyện thi JLPT</h2>
            </div>
            
            <!-- Level Filter Pills -->
            <div class="d-flex gap-2 mt-3 mt-md-0">
                <button class="btn btn-steel btn-sm">Tất cả</button>
                <button class="btn btn-light btn-sm border">N5</button>
                <button class="btn btn-light btn-sm border">N4</button>
                <button class="btn btn-light btn-sm border">N3</button>
                <button class="btn btn-light btn-sm border">N2</button>
                <button class="btn btn-light btn-sm border">N1</button>
            </div>
        </div>

        <!-- Course Cards Grid -->
        <div class="row">
            <!-- Course 1: N5 -->
            <div th:replace="~{fragments/components/course-card :: courseCard(
                course=${ {
                    id: 1,
                    title: 'Khóa học Nhập môn Tiếng Nhật & JLPT N5 Toàn diện',
                    description: 'Nắm vững bảng chữ cái Hiragana, Katakana, 100 chữ Hán căn bản và ngữ pháp giao tiếp đời sống.',
                    level: 'N5',
                    lessonCount: 30,
                    duration: '40 giờ',
                    price: 299000,
                    thumbnail: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=800&auto=format&fit=crop'
                } },
                isLearner=false
            )}"></div>

            <!-- Course 2: N4 -->
            <div th:replace="~{fragments/components/course-card :: courseCard(
                course=${ {
                    id: 2,
                    title: 'Luyện thi Sơ cấp Cấp tốc JLPT N4',
                    description: 'Mở rộng 300 Hán tự thông dụng, ngữ pháp sơ cấp nâng cao và rèn luyện kỹ năng nghe hiểu hội thoại ngắn.',
                    level: 'N4',
                    lessonCount: 35,
                    duration: '50 giờ',
                    price: 399000,
                    thumbnail: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=800&auto=format&fit=crop'
                } },
                isLearner=false
            )}"></div>

            <!-- Course 3: N3 -->
            <div th:replace="~{fragments/components/course-card :: courseCard(
                course=${ {
                    id: 3,
                    title: 'Chinh phục Đột phá Điểm số JLPT N3',
                    description: 'Bước ngoặt trung cấp với 650 Kanji, 150 mẫu ngữ pháp then chốt và chiến lược làm bài đọc hiểu phân tích.',
                    level: 'N3',
                    lessonCount: 42,
                    duration: '65 giờ',
                    price: 549000,
                    thumbnail: 'https://images.unsplash.com/photo-1528164344705-475426879c0d?q=80&w=800&auto=format&fit=crop'
                } },
                isLearner=false
            )}"></div>

            <!-- Course 4: N2 -->
            <div th:replace="~{fragments/components/course-card :: courseCard(
                course=${ {
                    id: 4,
                    title: 'Luyện đề Chuyên sâu & Kỹ năng Làm bài N2',
                    description: 'Khóa học trang bị tư duy giải đề chuẩn, phản xạ nghe hiểu tốc độ cao và mở rộng vốn từ vựng thương mại.',
                    level: 'N2',
                    lessonCount: 48,
                    duration: '75 giờ',
                    price: 699000,
                    thumbnail: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=800&auto=format&fit=crop'
                } },
                isLearner=false
            )}"></div>

            <!-- Course 5: N1 -->
            <div th:replace="~{fragments/components/course-card :: courseCard(
                course=${ {
                    id: 5,
                    title: 'Chuyên gia Tiếng Nhật Học thuật JLPT N1',
                    description: 'Đỉnh cao ngôn ngữ với ngữ pháp văn viết cổ và văn phong xã luận, văn học hiện đại chuẩn đề Bộ Giáo dục Nhật.',
                    level: 'N1',
                    lessonCount: 50,
                    duration: '90 giờ',
                    price: 899000,
                    thumbnail: 'https://images.unsplash.com/photo-1492571350019-22de08371fd3?q=80&w=800&auto=format&fit=crop'
                } },
                isLearner=false
            )}"></div>
        </div>
    </div>
</div>
