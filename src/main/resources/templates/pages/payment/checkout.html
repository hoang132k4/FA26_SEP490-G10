<div th:replace="~{layouts/learner-layout :: html(
    pageTitle='Thanh toán - JEPS',
    activeMenu='orders',
    content=~{::#mainContent}
)}">
    <div id="mainContent">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/learning/dashboard}" class="text-decoration-none" style="color: var(--fuji-blue)">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Checkout</li>
                    </ol>
                </nav>
                <h3 class="fw-bold mb-0" style="color: var(--navy-dark)">Thanh toán khóa học</h3>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3" style="color: var(--navy-dark)">Thông tin khóa học</h5>

                    <div th:if="${course != null}" class="d-flex gap-3 align-items-center">
                        <img th:src="${course.thumbnailUrl != null ? course.thumbnailUrl : '/images/course-default.png'}"
                             alt="Course thumbnail"
                             class="rounded-4 object-fit-cover"
                             style="width: 120px; height: 90px; object-fit: cover;">
                        <div>
                            <h6 class="fw-bold mb-1" th:text="${course.title}">Khóa học</h6>
                            <p class="text-muted mb-2" th:text="${course.shortDescription != null ? course.shortDescription : 'Khóa học tiếng Anh chuyên sâu'}">Mô tả ngắn</p>
                            <div class="fw-bold fs-5" style="color: var(--navy-dark)" th:text="${#numbers.formatDecimal(checkoutAmount, 0, 'COMMA', 0, 'POINT') + ' VND'}">0 VND</div>
                        </div>
                    </div>

                    <div th:unless="${course != null}" class="alert alert-warning">
                        Không có khóa học nào được chọn để thanh toán.
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3" style="color: var(--navy-dark)">Tóm tắt thanh toán</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Khóa học</span>
                        <strong th:text="${course != null ? course.title : 'Chưa chọn'}">-</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Phương thức</span>
                        <span>SePay VietQR</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Tổng tiền</span>
                        <strong class="fs-5" style="color: var(--navy-dark)" th:text="${course != null ? #numbers.formatDecimal(checkoutAmount, 0, 'COMMA', 0, 'POINT') + ' VND' : '0 VND'}">0 VND</strong>
                    </div>

                    <div th:if="${course != null}">
                        <form th:action="@{/checkout/{courseId}(courseId=${course.id})}" method="post">
                            <button type="submit" class="btn btn-primary w-100 rounded-3 fw-semibold py-2">
                                <i class="bi bi-credit-card me-2"></i> Tạo thanh toán
                            </button>
                        </form>
                    </div>
                    <a th:href="@{/learning/dashboard}" class="btn btn-outline-secondary w-100 rounded-3 mt-3">
                        Quay lại Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
