<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="html(pageTitle, activeMenu, content)">
<head th:replace="~{layouts/base :: head(${pageTitle})}"></head>
<body class="d-flex min-vh-100" style="background-color: var(--bg-page);">
    <!-- Kotoba Deep Navy Sidebar -->
    <aside style="width: 250px; flex-shrink: 0;">
        <div th:replace="~{fragments/sidebar-learner :: sidebar(${activeMenu})}"></div>
    </aside>

    <!-- Main Content Area -->
    <div class="d-flex flex-column flex-grow-1" style="min-width: 0; background-color: var(--bg-page);">
        <!-- Top Bar with Search & Profile -->
        <header class="kotoba-topbar">
            <!-- Search Pill -->
            <div class="kotoba-search-pill">
                <i class="bi bi-search text-muted"></i>
                <input type="text" placeholder="Tìm kiếm từ vựng, bài học, ngữ pháp...">
            </div>

            <!-- Right Controls: Notification & User Profile -->
            <div class="d-flex align-items-center gap-4">
                <!-- Notification Bell with Red Badge -->
                <button class="btn btn-link position-relative p-1 text-muted" type="button" style="text-decoration: none;">
                    <i class="bi bi-bell fs-5" style="color: var(--navy-dark)"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </button>

                <!-- User Dropdown Profile -->
                <div class="dropdown">
                    <button class="btn d-flex align-items-center gap-2 p-1 border-0" type="button" data-bs-toggle="dropdown">
                        <div class="rounded-circle d-flex align-items-center justify-content-center overflow-hidden shadow-sm" style="width: 38px; height: 38px; background-color: var(--navy-dark); color: white;">
                            <img th:if="${(currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty()) or (profile != null and profile.avatarUrl != null and !profile.avatarUrl.isEmpty())}"
                                 th:src="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty() ? currentUser.avatarUrl : profile.avatarUrl}"
                                 alt="Avatar" class="w-100 h-100 object-fit-cover" />
                            <span th:if="${((currentUser != null and (currentUser.avatarUrl == null or currentUser.avatarUrl.isEmpty())) or (profile != null and (profile.avatarUrl == null or profile.avatarUrl.isEmpty()))) and ((currentUser != null and currentUser.fullName != null) or (profile != null and profile.fullName != null))}"
                                  class="fw-bold"
                                  th:text="${currentUser != null and currentUser.fullName != null ? #strings.substring(currentUser.fullName, 0, 1).toUpperCase() : #strings.substring(profile.fullName, 0, 1).toUpperCase()}">
                                U
                            </span>
                            <i th:unless="${(currentUser != null and currentUser.fullName != null) or (profile != null and profile.fullName != null)}" class="bi bi-person-fill fs-5"></i>
                        </div>
                        <span class="fw-semibold small" style="color: var(--text-main);"
                              th:text="${currentUser != null and currentUser.fullName != null ? currentUser.fullName : (profile != null and profile.fullName != null ? profile.fullName : 'Học viên')}">
                            Nguyễn Văn A
                        </span>
                        <i class="bi bi-chevron-down small text-muted"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2">
                        <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i> Hồ sơ cá nhân</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/order/history}"><i class="bi bi-receipt me-2"></i> Lịch sử đơn hàng</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right me-2"></i> Đăng xuất</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="flex-grow-1 px-4 pb-5">
            <div th:replace="~{fragments/components/alert :: alert}"></div>
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
