<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="html(pageTitle, content)">
<head th:replace="~{layouts/base :: head(${pageTitle})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light justify-content-center align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <span class="brand-badge px-3 py-1 fs-5" style="background: linear-gradient(135deg, var(--navy-dark) 0%, var(--steel-blue) 100%); color: white; border-radius: 8px; font-weight: 800;">JEPS</span>
                        <h4 class="mt-2 fw-bold" style="color: var(--navy-dark)">Japanese Exam Preparation</h4>
                    </a>
                </div>
                <div th:replace="~{fragments/components/alert :: alert}"></div>
                <div class="card kotoba-card p-4 shadow-sm">
                    <div th:replace="${content}"></div>
                </div>
                <div class="text-center mt-3 text-muted small">
                    &copy; 2026 FA26_SEP490-G10
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
