<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="html(pageTitle, activeMenu, content)">
<head th:replace="~{layouts/base :: head(${pageTitle})}"></head>
<body class="d-flex min-vh-100" style="background-color: var(--bg-page);">
    <aside style="width: 250px; flex-shrink: 0;">
        <div th:replace="~{fragments/sidebar-manager :: sidebar(${activeMenu})}"></div>
    </aside>

    <div class="d-flex flex-column flex-grow-1" style="min-width: 0; background-color: var(--bg-page);">
        <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
            <h5 class="fw-bold mb-0" style="color: var(--navy-dark)">Quản lý nội dung &bull; JEPS</h5>
            <div class="d-flex align-items-center gap-3">
                <span class="badge" style="background-color: var(--steel-blue); color: white;">Manager Portal</span>
                <a th:href="@{/auth/logout}" class="btn btn-outline-danger btn-sm rounded-pill">
                    <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                </a>
            </div>
        </header>

        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/components/alert :: alert}"></div>
            <div th:replace="${content}"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
