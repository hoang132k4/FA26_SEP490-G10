<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="html(pageTitle, content)">
<head th:replace="~{layouts/base :: head(${pageTitle})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Top Nav Header -->
    <div th:replace="~{fragments/header :: header('GUEST')}"></div>

    <!-- Main Public Content -->
    <main class="flex-grow-1">
        <div class="container my-4">
            <div th:replace="~{fragments/components/alert :: alert}"></div>
            <div th:replace="${content}"></div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
