<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="html(pageTitle, content)">
<head th:replace="~{layouts/base :: head(${pageTitle})}"></head>
<body class="d-flex flex-column min-vh-100" style="background-color: #F8FAFC; color: var(--text-main);"
      th:with="activeMenu=${activeMenu != null ? activeMenu : (pageTitle == 'Home Page' ? 'home' : (pageTitle == 'Course List' ? 'courses' : (pageTitle == 'JLPT Mock Exam' ? 'mock' : (pageTitle == 'About Us' ? 'about' : ''))))}">
    <!-- Top Nav Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Public Content -->
    <main class="flex-grow-1">
        <div class="container my-4">
            <div th:replace="~{fragments/components/alert :: alert}"></div>
            <div th:replace="${content}"></div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
