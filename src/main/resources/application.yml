server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: jeps-platform

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # Static Web Resource Caching
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 86400
          must-revalidate: true

  # Thymeleaf configuration (Cached in-memory for 10-30ms performance)
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  # Spring Security OAuth2 Client Configuration for Google Sign In / Sign Up
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  # Supabase PostgreSQL Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&tcpKeepAlive=true}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.eztcijnvnmcievogjufk}
    password: ${SPRING_DATASOURCE_PASSWORD:Cme85Dpt1b2HwrBQ}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 60000
      connection-timeout: 10000
      max-lifetime: 1800000
      keepalive-time: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  # Mail configuration (Gmail SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:phanmanh14122000@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:yvzhbqyfzaubwjzd}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Application Custom Configurations
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  reset-password:
    token-validity-minutes: 15
    rate-limit-per-window: 3
    rate-limit-window-minutes: 15

  # Mail configuration (uses env vars if provided)
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}


# Logging
logging:
  level:
    root: INFO
    com.jeps: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

---
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.eztcijnvnmcievogjufk.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Cme85Dpt1b2HwrBQ}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

